<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gao Ran Racing - Easy & Pro UX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212; font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* Layout Utama: Memisahkan Layar Game dan Area Kontrol Jempol */
        #game-wrapper {
            position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 600px;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 12px; overflow: hidden;
        }

        /* Area Canvas (Game) */
        #canvas-container {
            flex-grow: 1; position: relative; width: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* Area Kontrol (Bawah) - Ergonomis untuk Jempol */
        #controls-container {
            height: 100px; background: #2E7D32; border-top: 4px solid #1B5E20;
            display: flex; justify-content: space-between; padding: 10px; gap: 10px;
        }
        
        .lane-btn {
            flex: 1; background: #4CAF50; border: 4px solid #81C784; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: 900; font-size: 16px; cursor: pointer;
            box-shadow: 0 6px 0 #1B5E20; transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .lane-btn:active, .lane-btn.active-touch {
            transform: translateY(6px); box-shadow: 0 0 0 #1B5E20; background: #66BB6A;
        }

        .btn-emoji { font-size: 32px; line-height: 1; margin-bottom: 5px; }

        /* HUD & UI Overlays */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
        }

        .hud {
            display: flex; justify-content: space-between; padding: 15px; pointer-events: auto;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.6); color: #FFEB3B;
            padding: 8px 20px; border-radius: 20px; font-size: 22px; font-weight: 900;
            border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(4px);
        }

        .btn-sound {
            background: rgba(0,0,0,0.6); color: white; border: 2px solid rgba(255,255,255,0.3);
            width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer;
        }

        /* Screens (Start & Game Over) */
        .screen-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.7); pointer-events: auto; transition: opacity 0.3s; z-index: 50;
        }

        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        .title { color: white; font-size: 42px; text-shadow: 3px 3px 0 #000; text-align: center; font-weight: 900; }
        .subtitle { color: #81C784; font-size: 16px; margin-bottom: 30px; margin-top: 10px; font-weight: 700; text-align: center;}
        
        .btn-play {
            background: linear-gradient(180deg, #FFCA28, #FF9800);
            color: #3e2723; border: none; padding: 15px 50px; font-size: 28px;
            border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900;
            box-shadow: 0 8px 0 #E65100; cursor: pointer; text-transform: uppercase;
        }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0 0 #E65100; }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="ui-layer" id="ui-hud" style="display: none;">
                <div class="hud">
                    <div class="hud-box" id="scoreDisplay">🪙 0</div>
                    <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
                </div>
            </div>

            <div class="screen-center" id="ui-start">
                <div class="title">GAO RAN<br>RACING</div>
                <div class="subtitle">Tap tombol di bawah untuk melompat!<br>Hindari batu, kumpulkan koin skor.</div>
                <button class="btn-play" onclick="startGame()">MAIN</button>
            </div>

            <div class="screen-center hidden" id="ui-gameover">
                <div class="title" style="color: #FF5252;">YAH, NABRAK!</div>
                <div class="subtitle" style="color: white; font-size: 24px;">Skor Kamu: <span id="finalScore">0</span></div>
                <button class="btn-play" onclick="startGame()">COBA LAGI</button>
            </div>
        </div>

        <div id="controls-container">
            <div class="lane-btn" id="btn-orange">
                <div class="btn-emoji">🍊</div><div>TAP</div>
            </div>
            <div class="lane-btn" id="btn-corn">
                <div class="btn-emoji">🌽</div><div>TAP</div>
            </div>
            <div class="lane-btn" id="btn-carrot">
                <div class="btn-emoji">🥕</div><div>TAP</div>
            </div>
        </div>
    </div>

    <script>
        // --- SISTEM AUDIO (SYNTHESIZER & BGM) ---
        let audioCtx;
        let soundEnabled = true;
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.3; // Volume BGM Pelan saja

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled && state === 'PLAY') bgm.play();
            else bgm.pause();
        }

        function playSFX(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                // Suara lompat (Pitch naik)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'score') {
                // Suara koin (Ting!)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit') {
                // Suara nabrak (Pitch turun drastis)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- SISTEM GAME (CANVAS) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');
        
        let state = 'START'; 
        let lastTime = 0, score = 0, gameSpeed = 0, distance = 0, nextObstacleTime = 0;
        let cw, ch;

        // PENGATURAN FISIKA YANG LEBIH MUDAH
        const GRAVITY = 1800; // Lebih mengambang (sebelumnya 2800)
        const JUMP_VELOCITY = -700; // Lompatan pas
        const GROUND_Y_RATIO = 0.80; // Tanah sedikit lebih ke bawah

        let characters = [], obstacles = [], particles = [], trackOffset = 0, bgOffset = 0;

        function resize() {
            cw = canvasContainer.clientWidth;
            ch = canvasContainer.clientHeight;
            canvas.width = cw; canvas.height = ch;
        }
        window.addEventListener('resize', resize);
        resize();

        class Character {
            constructor(emoji, zone) {
                this.emoji = emoji;
                this.zone = zone; 
                this.size = ch * 0.16;
                this.x = (cw / 4) * (this.zone + 1); 
                this.y = ch * GROUND_Y_RATIO;
                this.vy = 0; this.isJumping = false;
                
                // Hitbox sangat dimudahkan (Hanya 25% dari ukuran asli)
                this.hitRadius = this.size * 0.25; 
            }

            jump() {
                if (!this.isJumping) {
                    this.vy = JUMP_VELOCITY;
                    this.isJumping = true;
                    playSFX('jump');
                    createDust(this.x, this.y);
                }
            }

            update(dt) {
                this.x = (cw / 4) * (this.zone + 1);
                this.size = ch * 0.16;
                this.hitRadius = this.size * 0.25;
                let ground = ch * GROUND_Y_RATIO;

                if (this.isJumping) {
                    this.vy += GRAVITY * dt;
                    this.y += this.vy * dt;
                    if (this.y >= ground) {
                        this.y = ground; this.vy = 0; this.isJumping = false;
                        createDust(this.x, this.y);
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y - this.size/2);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                if (this.isJumping) ctx.rotate(0.2); // Rotasi kecil biar cute
                
                ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 8;
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.size = ch * 0.12;
                this.x = cw + this.size;
                this.y = ch * GROUND_Y_RATIO;
                this.hitRadius = this.size * 0.35;
                this.passedBy = []; 
            }
            update(dt) { this.x -= gameSpeed * dt; }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y - this.size/2);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 5;
                ctx.fillText('🪨', 0, 0);
                ctx.restore();
            }
        }

        function createDust(x, y) {
            // Animasi Partikel dihilangkan sebagian agar performa fokus ke kemudahan main
        }

        function init() {
            characters = [new Character('🍊', 0), new Character('🌽', 1), new Character('🥕', 2)];
            obstacles = [];
            score = 0;
            // Kecepatan jauh lebih lambat di awal agar gampang
            gameSpeed = cw * 0.35; 
            document.getElementById('scoreDisplay').innerText = `🪙 ${score}`;
            nextObstacleTime = 2000; // Batu pertama muncul lebih lama (2 detik)
        }

        function startGame() {
            initAudio(); // Aktifkan Web Audio API
            if (soundEnabled) bgm.play().catch(e => console.log("Auto-play prevented"));

            document.getElementById('ui-start').classList.add('hidden');
            document.getElementById('ui-gameover').classList.add('hidden');
            document.getElementById('ui-hud').style.display = 'flex';
            
            init();
            state = 'PLAY';
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'GAMEOVER';
            playSFX('hit');
            bgm.pause();
            document.getElementById('ui-hud').style.display = 'none';
            document.getElementById('ui-gameover').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function gameLoop(timestamp) {
            if (state !== 'PLAY') return;
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; 
            lastTime = timestamp;

            update(dt); draw();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameSpeed += dt * 1.5; // Kecepatan bertambah SANGAT pelan
            bgOffset = (bgOffset + (gameSpeed * 0.1) * dt) % cw;
            trackOffset = (trackOffset + gameSpeed * dt) % 160; 

            characters.forEach(char => char.update(dt));

            nextObstacleTime -= dt * 1000;
            if (nextObstacleTime <= 0) {
                obstacles.push(new Obstacle());
                // Jarak antar batu diperjauh (1.8 - 3 detik) agar sangat mudah diantisipasi
                nextObstacleTime = Math.random() * 1500 + 1800; 
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.update(dt);

                characters.forEach((char, index) => {
                    let dx = char.x - obs.x;
                    let dy = (char.y - char.size/2) - (obs.y - obs.size/2);
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < char.hitRadius + obs.hitRadius) gameOver();

                    if (obs.x < char.x && !obs.passedBy.includes(index)) {
                        obs.passedBy.push(index);
                        score += 5;
                        document.getElementById('scoreDisplay').innerText = `🪙 ${score}`;
                        if (obs.passedBy.length === 1) playSFX('score'); // Bunyi koin sekali saja per batu
                    }
                });
                if (obs.x < -100) obstacles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);

            // Background & Track
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, cw, ch);
            
            let groundY = ch * GROUND_Y_RATIO;
            for (let x = -trackOffset; x < cw; x += 160) {
                ctx.fillStyle = '#FFCA28'; ctx.fillRect(x, groundY, 80, ch - groundY);
                ctx.fillStyle = '#FF7043'; ctx.fillRect(x + 80, groundY, 80, ch - groundY);
            }
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, groundY, cw, 10); // Garis hijau

            // Jalur UI di dalam Canvas (Visual Feedback yang lebih mudah)
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(cw/4 - cw/8, 0, cw/4, ch);
            ctx.fillRect((cw/4)*3 - cw/8, 0, cw/4, ch);

            obstacles.forEach(obs => obs.draw(ctx));
            characters.forEach(char => char.draw(ctx));
        }

        // --- BINDING TOMBOL UI (UX JEMPOL) ---
        const btns = [
            { el: document.getElementById('btn-orange'), id: 0 },
            { el: document.getElementById('btn-corn'), id: 1 },
            { el: document.getElementById('btn-carrot'), id: 2 }
        ];

        btns.forEach(btn => {
            // Touch untuk Mobile, Mousedown untuk PC
            btn.el.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                btn.el.classList.add('active-touch');
                if (state === 'PLAY') characters[btn.id].jump();
            }, {passive: false});
            
            btn.el.addEventListener('touchend', (e) => {
                e.preventDefault(); btn.el.classList.remove('active-touch');
            });

            btn.el.addEventListener('mousedown', (e) => {
                if (state === 'PLAY') characters[btn.id].jump();
            });
        });

        draw(); // Render pertama
    </script>
</body>
</html>
