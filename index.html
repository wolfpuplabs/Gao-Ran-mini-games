<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gao Ran Racing - Professional Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1117; font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-wrapper {
            position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 800px;
            display: flex; flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); overflow: hidden;
            background: #87CEEB;
        }

        #canvas-container { flex-grow: 1; position: relative; width: 100%; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Pro UI - Controls */
        #controls-container {
            height: 110px; background: linear-gradient(to bottom, #2E7D32, #1B5E20);
            border-top: 4px solid #4CAF50;
            display: flex; justify-content: space-between; padding: 12px 16px; gap: 15px; z-index: 100;
        }
        
        .lane-btn {
            flex: 1; background: linear-gradient(to bottom, #66BB6A, #4CAF50);
            border: 3px solid #A5D6A7; border-radius: 18px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: 900; font-size: 16px; cursor: pointer;
            box-shadow: 0 8px 0 #1B5E20, 0 10px 15px rgba(0,0,0,0.3); 
            transition: transform 0.05s, box-shadow 0.05s;
        }
        
        .lane-btn:active, .lane-btn.active-touch {
            transform: translateY(8px); box-shadow: 0 0 0 #1B5E20, 0 0 0 rgba(0,0,0,0); 
            background: linear-gradient(to bottom, #81C784, #66BB6A);
        }

        .btn-emoji { font-size: 34px; line-height: 1; margin-bottom: 2px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        /* HUD */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .hud { display: flex; justify-content: space-between; padding: 20px; pointer-events: auto; }

        .hud-box {
            background: rgba(0, 0, 0, 0.4); color: #FFEB3B;
            padding: 8px 24px; border-radius: 30px; font-size: 24px; font-weight: 900;
            border: 2px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;
        }
        .hud-stage { color: #fff; background: rgba(33, 150, 243, 0.4); }

        .btn-sound {
            background: rgba(0,0,0,0.4); color: white; border: 2px solid rgba(255,255,255,0.15);
            width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer;
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
        }

        /* Screens */
        .screen-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(10, 15, 25, 0.75); pointer-events: auto; transition: opacity 0.4s; z-index: 50; backdrop-filter: blur(5px);
        }

        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        .title { color: white; font-size: 52px; text-shadow: 0 6px 0 #2E7D32, 0 10px 20px rgba(0,0,0,0.5); text-align: center; font-weight: 900; line-height: 1.1; letter-spacing: 2px; }
        .subtitle { color: #fff; background: rgba(255, 152, 0, 0.9); padding: 8px 20px; border-radius: 25px; font-size: 16px; margin: 25px 0 35px 0; font-weight: 700; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        
        .btn-play {
            background: linear-gradient(to bottom, #FFD54F, #FF9800); color: #3e2723; border: 4px solid #fff; padding: 15px 70px; font-size: 32px;
            border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900;
            box-shadow: 0 8px 0 #E65100, 0 15px 25px rgba(0,0,0,0.4); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0 0 #E65100, 0 0 0 rgba(0,0,0,0); }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="ui-layer" id="ui-hud" style="display: none;">
                <div class="hud">
                    <div style="display: flex; gap: 12px;">
                        <div class="hud-box" id="scoreDisplay">🪙 0</div>
                        <div class="hud-box hud-stage" id="stageDisplay">STAGE 1</div>
                    </div>
                    <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
                </div>
            </div>

            <div class="screen-center" id="ui-start">
                <div class="title">GAO RAN<br>RACING</div>
                <div class="subtitle">Tap tombol di bawah untuk melompat!</div>
                <button class="btn-play" onclick="startGame()">MAIN</button>
            </div>

            <div class="screen-center hidden" id="ui-gameover">
                <div class="title" style="color: #FF5252; text-shadow: 0 6px 0 #b71c1c, 0 10px 20px rgba(0,0,0,0.5);">YAH, NABRAK!</div>
                <div class="subtitle" style="font-size: 26px;">Skor Akhir: <span id="finalScore">0</span></div>
                <button class="btn-play" onclick="startGame()">COBA LAGI</button>
            </div>
        </div>

        <div id="controls-container">
            <div class="lane-btn" id="btn-orange"><div class="btn-emoji">🍊</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-corn"><div class="btn-emoji">🌽</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-carrot"><div class="btn-emoji">🥕</div><div>TAP</div></div>
        </div>
    </div>

    <script>
        // --- AUDIO SYSTEM (PRO SYNTH) ---
        let audioCtx, soundEnabled = true;
        const bgm = document.getElementById('bgm'); bgm.volume = 0.25;
        
        function initAudio() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }
        function toggleSound() { 
            soundEnabled = !soundEnabled; 
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇'; 
            if (soundEnabled && state === 'PLAY') bgm.play(); else bgm.pause(); 
        }
        
        function playSFX(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'score') {
                osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1800, now + 0.05);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'), container = document.getElementById('canvas-container');
        let state = 'START', lastTime = 0, score = 0, gameSpeed = 0, nextObstacleTime = 0, currentStage = 1, stageAnnounceTimer = 0, cw, ch;

        // Fisika Profesional (Snappy & Responsive)
        const GRAVITY = 3200; 
        const JUMP_VELOCITY = -1000; 
        const GROUND_Y_RATIO = 0.82; 
        const SCORE_PER_STAGE = 60;

        const stageColors = [
            { top: '#64B5F6', bot: '#E1F5FE' }, { top: '#FFB74D', bot: '#FFF8E1' },
            { top: '#BA68C8', bot: '#FCE4EC' }, { top: '#283593', bot: '#7986CB' }, { top: '#c62828', bot: '#ffcdd2' }
        ];

        let characters = [], obstacles = [], particles = [], floatingTexts = [], trackOffset = 0, bgOffset = 0, timeElapsed = 0;
        function resize() { cw = container.clientWidth; ch = container.clientHeight; canvas.width = cw; canvas.height = ch; }
        window.addEventListener('resize', resize); resize();

        // --- BACKGROUND & PARALLAX ---
        function drawMountains() {
            let mX = -(bgOffset * 0.15) % cw; ctx.fillStyle = '#90A4AE'; 
            for (let i = 0; i < 2; i++) {
                let startX = mX + (i * cw);
                ctx.beginPath(); ctx.moveTo(startX - 100, ch * GROUND_Y_RATIO); ctx.lineTo(startX + cw*0.3, ch * 0.3); ctx.lineTo(startX + cw*0.7, ch * GROUND_Y_RATIO); ctx.fill();
                ctx.fillStyle = '#CFD8DC'; ctx.beginPath(); ctx.moveTo(startX + cw*0.3, ch * 0.3); ctx.lineTo(startX + cw*0.2, ch * 0.45); ctx.lineTo(startX + cw*0.3, ch * 0.42); ctx.lineTo(startX + cw*0.4, ch * 0.45); ctx.fill();
                ctx.fillStyle = '#78909C'; ctx.beginPath(); ctx.moveTo(startX + cw*0.4, ch * GROUND_Y_RATIO); ctx.lineTo(startX + cw*0.7, ch * 0.4); ctx.lineTo(startX + cw*1.1, ch * GROUND_Y_RATIO); ctx.fill();
            }
        }
        function drawFields() {
            let fX = -(bgOffset * 0.4) % cw; 
            for (let i = 0; i < 2; i++) {
                let startX = fX + (i * cw);
                ctx.fillStyle = '#689F38'; ctx.beginPath(); ctx.moveTo(startX, ch * GROUND_Y_RATIO); ctx.quadraticCurveTo(startX + cw*0.5, ch * 0.55, startX + cw, ch * GROUND_Y_RATIO); ctx.fill();
                ctx.fillStyle = '#8BC34A'; ctx.beginPath(); ctx.moveTo(startX - cw*0.2, ch * GROUND_Y_RATIO); ctx.quadraticCurveTo(startX + cw*0.3, ch * 0.65, startX + cw*0.8, ch * GROUND_Y_RATIO); ctx.fill();
            }
        }

        // --- VISUAL EFFECTS (VFX) ---
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 150 - (gameSpeed * 0.5); 
                this.vy = (Math.random() - 1) * 150;
                this.life = 1.0; this.size = Math.random() * 8 + 4;
            }
            update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt * 3; }
            draw(ctx) {
                ctx.fillStyle = this.color.replace(')', `, ${this.life})`).replace('rgb', 'rgba');
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }
        class FloatingText {
            constructor(text, x, y) {
                this.text = text; this.x = x; this.y = y; this.life = 1.0; this.vy = -100;
            }
            update(dt) { this.y += this.vy * dt; this.life -= dt * 1.5; }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `900 ${ch * 0.05}px Nunito`; ctx.fillStyle = '#FFEB3B'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y); ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }
        function spawnDust(x, y) { for(let i=0; i<5; i++) particles.push(new Particle(x, y, 'rgb(200, 200, 200)')); }

        // --- GAME ENTITIES ---
        class Character {
            constructor(emoji, zone) {
                this.emoji = emoji; this.zone = zone; 
                this.size = ch * 0.11; 
                
                // MUNDUR KE KIRI: Jarak fix berdasarkan ukuran mereka sendiri agar rapi dan tidak ke tengah
                let startPadding = cw * 0.10; // Mulai dari 10% layar kiri
                let gap = this.size * 1.3; // Jarak antar karakter sedikit lebih besar dari ukurannya
                this.baseX = startPadding + (this.zone * gap);
                
                this.x = this.baseX; this.y = ch * GROUND_Y_RATIO;
                this.vy = 0; this.isJumping = false;
                this.hitRadius = this.size * 0.25; 
            }
            jump() { if (!this.isJumping) { this.vy = JUMP_VELOCITY; this.isJumping = true; playSFX('jump'); spawnDust(this.x, this.y); } }
            
            update(dt) {
                this.size = ch * 0.11; this.hitRadius = this.size * 0.25;
                let gap = this.size * 1.3;
                this.baseX = (cw * 0.10) + (this.zone * gap);
                this.x = this.baseX;
                
                let ground = ch * GROUND_Y_RATIO;
                if (this.isJumping) {
                    this.vy += GRAVITY * dt; this.y += this.vy * dt;
                    if (this.y >= ground) { this.y = ground; this.vy = 0; this.isJumping = false; spawnDust(this.x, this.y); }
                } else {
                    this.y = ground;
                }
            }
            
            draw(ctx) {
                ctx.save();
                
                // Idle Animation (Napas naik turun) saat tidak lompat
                let bob = this.isJumping ? 0 : Math.sin(timeElapsed * 10 + this.zone) * (this.size * 0.05);
                ctx.translate(this.x, this.y - this.size/2 + bob);
                
                // Squash & Stretch Animation
                let scaleX = 1, scaleY = 1;
                if (this.isJumping) {
                    scaleX = 0.9; scaleY = 1.1; // Memanjang saat naik
                    if (this.vy > 0) { scaleX = 1.05; scaleY = 0.95; } // Memipih saat turun
                }
                ctx.scale(scaleX, scaleY);
                
                ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                if (this.isJumping) ctx.rotate(0.15); 
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 8; 
                ctx.fillText(this.emoji, 0, 0); 
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.size = ch * 0.09; this.x = cw + this.size; this.y = ch * GROUND_Y_RATIO; 
                this.hitRadius = this.size * 0.30; this.passedBy = []; this.rotation = 0;
            }
            update(dt) { 
                this.x -= gameSpeed * dt; 
                this.rotation -= (gameSpeed * dt) / (this.size/2); // Rotasi berdasarkan kecepatan (menggelinding)
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y - this.size/2.5);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 4; ctx.shadowBlur = 4;
                ctx.fillText('🪨', 0, 0); ctx.restore();
            }
        }

        // --- CORE LOOP ---
        function init() {
            characters = [new Character('🍊', 0), new Character('🌽', 1), new Character('🥕', 2)];
            obstacles = []; particles = []; floatingTexts = []; timeElapsed = 0;
            score = 0; currentStage = 1; stageAnnounceTimer = 0;
            gameSpeed = cw * 0.7; // Speed awal dinamis menyesuaikan lebar layar
            document.getElementById('scoreDisplay').innerText = `🪙 0`; document.getElementById('stageDisplay').innerText = `STAGE 1`;
            nextObstacleTime = 1200;
        }

        function startGame() {
            initAudio(); if (soundEnabled) bgm.play().catch(e => console.log("Audio prep"));
            document.getElementById('ui-start').classList.add('hidden'); document.getElementById('ui-gameover').classList.add('hidden');
            document.getElementById('ui-hud').style.display = 'flex'; init(); state = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'GAMEOVER'; playSFX('hit'); bgm.pause();
            document.getElementById('ui-hud').style.display = 'none'; document.getElementById('ui-gameover').classList.remove('hidden'); document.getElementById('finalScore').innerText = score;
        }

        function gameLoop(timestamp) {
            if (state !== 'PLAY') return; 
            let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp; timeElapsed += dt;
            update(dt); draw(); requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameSpeed += dt * 3.0; // Gradual speed up
            bgOffset = (bgOffset + gameSpeed * dt); trackOffset = (trackOffset + gameSpeed * dt) % 160; 
            if (stageAnnounceTimer > 0) stageAnnounceTimer -= dt;

            // Stage Check
            let targetStage = Math.floor(score / SCORE_PER_STAGE) + 1;
            if (targetStage > currentStage) {
                currentStage = targetStage; stageAnnounceTimer = 2.0; playSFX('stageUp'); gameSpeed += cw * 0.06;
                document.getElementById('stageDisplay').innerText = `STAGE ${currentStage}`;
            }

            // Updates
            characters.forEach(char => char.update(dt));
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(dt); if (particles[i].life <= 0) particles.splice(i, 1); }
            for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(dt); if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1); }

            // Obstacle Spawner (Lebih bisa diprediksi)
            nextObstacleTime -= dt * 1000;
            if (nextObstacleTime <= 0) {
                obstacles.push(new Obstacle());
                let baseWait = Math.max(900, 1500 - (currentStage * 100)); 
                nextObstacleTime = Math.random() * 600 + baseWait; 
            }

            // Collision & Scoring
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.update(dt);
                characters.forEach((char, index) => {
                    // Cek Hitbox Circular
                    let dx = char.x - obs.x, dy = (char.y - char.size/2) - (obs.y - obs.size/2);
                    if (Math.sqrt(dx*dx + dy*dy) < char.hitRadius + obs.hitRadius) gameOver();
                    
                    // Cek Skor
                    if (obs.x < char.x && !obs.passedBy.includes(index)) {
                        obs.passedBy.push(index); score += 5; document.getElementById('scoreDisplay').innerText = `🪙 ${score}`;
                        if (obs.passedBy.length === 1) {
                            playSFX('score');
                            floatingTexts.push(new FloatingText("+15", char.x + 30, char.y - char.size)); // Teks Pop-up
                        }
                    }
                });
                if (obs.x < -100) obstacles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);
            
            // 1. Sky & Environment
            let colorIndex = Math.min(currentStage - 1, stageColors.length - 1), activeColor = stageColors[colorIndex];
            let skyGrad = ctx.createLinearGradient(0, 0, 0, ch); skyGrad.addColorStop(0, activeColor.top); skyGrad.addColorStop(1, activeColor.bot);
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, cw, ch);
            drawMountains(); drawFields();
            
            // 2. Track
            let groundY = ch * GROUND_Y_RATIO;
            ctx.fillStyle = '#2E7D32'; ctx.fillRect(0, groundY - 12, cw, 12); // Tepi rumput gelap
            for (let x = -trackOffset; x < cw; x += 160) { ctx.fillStyle = '#FFCA28'; ctx.fillRect(x, groundY, 80, ch - groundY); ctx.fillStyle = '#FF7043'; ctx.fillRect(x + 80, groundY, 80, ch - groundY); }
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, groundY, cw, 8); // Garis start

            // 3. Entities
            obstacles.forEach(obs => obs.draw(ctx)); 
            characters.forEach(char => char.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            floatingTexts.forEach(ft => ft.draw(ctx));

            // 4. Stage Announcer
            if (stageAnnounceTimer > 0) {
                ctx.save(); let alpha = Math.min(1, stageAnnounceTimer); 
                let scale = 1 + (1 - alpha) * 0.5; // Efek membesar saat hilang
                ctx.translate(cw / 2, ch / 3); ctx.scale(scale, scale);
                ctx.fillStyle = `rgba(255, 235, 59, ${alpha})`; ctx.font = `900 ${ch * 0.12}px Nunito`; 
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`; ctx.lineWidth = 8;
                ctx.strokeText(`STAGE ${currentStage}!`, 0, 0); ctx.fillText(`STAGE ${currentStage}!`, 0, 0); ctx.restore();
            }
        }

        // --- CONTROLS ---
        const btns = [{ el: document.getElementById('btn-orange'), id: 0 }, { el: document.getElementById('btn-corn'), id: 1 }, { el: document.getElementById('btn-carrot'), id: 2 }];
        btns.forEach(btn => {
            btn.el.addEventListener('touchstart', (e) => { e.preventDefault(); btn.el.classList.add('active-touch'); if (state === 'PLAY') characters[btn.id].jump(); }, {passive: false});
            btn.el.addEventListener('touchend', (e) => { e.preventDefault(); btn.el.classList.remove('active-touch'); });
            btn.el.addEventListener('mousedown', (e) => { if (state === 'PLAY') characters[btn.id].jump(); });
        });
        draw(); 
    </script>
</body>
</html>
