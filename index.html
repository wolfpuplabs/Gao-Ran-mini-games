<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gao Ran Racing - 3D Low Poly Arcade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-wrapper {
            position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 800px;
            display: flex; flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); overflow: hidden;
            background: #87CEEB; /* Warna langit jika 3D loading lambat */
        }

        #canvas-container { flex-grow: 1; position: relative; width: 100%; }
        
        /* 3D Canvas diatur mutlak di belakang UI */
        #gameCanvas3D { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

        /* --- PRO UI SYSTEM (Sama, tapi diperhalus) --- */
        #controls-container {
            height: 110px; background: linear-gradient(to bottom, #2E7D32, #1B5E20);
            border-top: 5px solid #4CAF50;
            display: flex; justify-content: space-between; padding: 12px 16px; gap: 15px; z-index: 100;
        }
        
        .lane-btn {
            flex: 1; background: linear-gradient(to bottom, #66BB6A, #4CAF50);
            border: 3px solid #A5D6A7; border-radius: 18px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: 900; font-size: 16px; cursor: pointer;
            box-shadow: 0 8px 0 #1B5E20, 0 10px 15px rgba(0,0,0,0.3); 
            transition: transform 0.05s, box-shadow 0.05s;
        }
        
        .lane-btn:active, .lane-btn.active-touch {
            transform: translateY(8px); box-shadow: 0 0 0 #1B5E20, 0 0 0 rgba(0,0,0,0); 
            background: linear-gradient(to bottom, #81C784, #66BB6A);
        }

        .btn-emoji { font-size: 34px; line-height: 1; margin-bottom: 2px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; z-index: 10; }
        .hud { display: flex; justify-content: space-between; padding: 20px; pointer-events: auto; }

        .hud-box {
            background: rgba(0, 0, 0, 0.3); color: #FFF;
            padding: 8px 24px; border-radius: 30px; font-size: 24px; font-weight: 900;
            border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; text-shadow: 1px 2px 0 #000;
        }
        .hud-stage { color: #fff; background: rgba(33, 150, 243, 0.5); }

        .btn-sound {
            background: rgba(0,0,0,0.4); color: white; border: 2px solid rgba(255,255,255,0.15);
            width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer;
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
        }

        .screen-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(10, 15, 25, 0.75); pointer-events: auto; transition: opacity 0.4s; z-index: 50; backdrop-filter: blur(5px);
        }

        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        .title { color: white; font-size: 52px; text-shadow: 0 6px 0 #2E7D32, 0 10px 20px rgba(0,0,0,0.5); text-align: center; font-weight: 900; line-height: 1.1; letter-spacing: 2px; }
        .subtitle { color: #fff; background: rgba(255, 152, 0, 0.9); padding: 8px 20px; border-radius: 25px; font-size: 16px; margin: 25px 0 35px 0; font-weight: 900; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        
        .btn-play {
            background: linear-gradient(to bottom, #FFD54F, #FF9800); color: #3e2723; border: 4px solid #fff; padding: 15px 70px; font-size: 32px;
            border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900;
            box-shadow: 0 8px 0 #E65100, 0 15px 25px rgba(0,0,0,0.4); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0 0 #E65100, 0 0 0 rgba(0,0,0,0); }
        
        /* Floating text style (HTML Overlay for points) */
        .floating-text {
            position: absolute; font-size: 28px; font-weight: 900; color: #FFEB3B;
            text-shadow: 0 3px 0 #000, 0 5px 10px rgba(0,0,0,0.5); pointer-events: none;
            transition: transform 0.8s ease-out, opacity 0.8s ease-out; z-index: 20;
        }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="gameCanvas3D"></canvas>
            
            <div class="ui-layer" id="ui-hud" style="display: none;">
                <div class="hud">
                    <div style="display: flex; gap: 12px;">
                        <div class="hud-box" id="scoreDisplay">🪙 0</div>
                        <div class="hud-box hud-stage" id="stageDisplay">STAGE 1</div>
                    </div>
                    <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
                </div>
                <div id="floating-text-container" style="position: absolute; width:100%; height:100%;"></div>
            </div>

            <div class="screen-center" id="ui-start">
                <div class="title">GAO RAN<br>3D RACING</div>
                <div class="subtitle">Arcade Low Poly Edition!</div>
                <button class="btn-play" onclick="startGame()">MAIN</button>
            </div>

            <div class="screen-center hidden" id="ui-gameover">
                <div class="title" style="color: #FF5252; text-shadow: 0 6px 0 #b71c1c, 0 10px 20px rgba(0,0,0,0.5);">NABRAK!</div>
                <div class="subtitle" style="font-size: 26px;">Skor Akhir: <span id="finalScore">0</span></div>
                <button class="btn-play" onclick="startGame()">COBA LAGI</button>
            </div>
        </div>

        <div id="controls-container">
            <div class="lane-btn" id="btn-orange"><div class="btn-emoji">🍊</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-corn"><div class="btn-emoji">🌽</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-carrot"><div class="btn-emoji">🥕</div><div>TAP</div></div>
        </div>
    </div>

    <script>
        // --- AUDIO SYSTEM (Retained for 0 dependencies) ---
        let audioCtx, soundEnabled = true;
        const bgm = document.getElementById('bgm'); bgm.volume = 0.25;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇'; if (soundEnabled && state === 'PLAY') bgm.play(); else bgm.pause(); }
        function playSFX(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            
            if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.15); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
            else if (type === 'score') { osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1800, now + 0.05); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
            else if (type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.3); gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'stageUp') { osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5); }
        }

        // --- 3D ENGINE (THREE.JS) SETUP ---
        const canvas = document.getElementById('gameCanvas3D');
        const container = document.getElementById('canvas-container');
        let cw = container.clientWidth, ch = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Langit siang
        scene.fog = new THREE.Fog(0x87CEEB, 15, 30); // Efek kabut di ujung jalan

        // Kamera (Side-scrolling sedikit miring ke bawah/isometrik)
        const camera = new THREE.PerspectiveCamera(45, cw / ch, 0.1, 100);
        camera.position.set(0, 6, 16);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(cw, ch);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Pencahayaan Vibe Arcade (Terang & Punya Bayangan Jelas)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Cahaya merata
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.left = -15; dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 10; dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        // --- 3D ASSET GENERATOR (PROSEDURAL LOW POLY) ---
        // Material Low Poly Dasar
        const getMat = (color) => new THREE.MeshStandardMaterial({ color: color, flatShading: true, roughness: 0.8 });

        // 1. Lingkungan (Tanah & Gunung)
        const groundGeo = new THREE.BoxGeometry(40, 2, 10);
        const groundMat = getMat(0x4CAF50);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -1; // Permukaan tanah ada di Y=0
        ground.receiveShadow = true;
        scene.add(ground);

        // Trek Belang-belang
        const trackGeo = new THREE.BoxGeometry(40, 0.1, 3.5);
        const trackMat = getMat(0xFFCA28);
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.set(0, 0.01, 1); // Sedikit di atas tanah
        track.receiveShadow = true;
        scene.add(track);

        // Gunung Parallax Belakang
        const mountains = new THREE.Group();
        const mGeo = new THREE.ConeGeometry(5, 8, 4); // Gunung prisma segi-4
        const mMat = getMat(0x90A4AE);
        for(let i=0; i<3; i++) {
            let m = new THREE.Mesh(mGeo, mMat);
            m.position.set(-15 + (i*15), 3, -8);
            m.rotation.y = Math.PI / 4;
            mountains.add(m);
        }
        scene.add(mountains);

        // 2. Pabrik Karakter (Membuat mesh 3D dari kode murni)
        function createOrange3D() {
            const group = new THREE.Group();
            // Jeruk (Sphere poligon rendah)
            const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 1), getMat(0xFF9800));
            body.castShadow = true;
            // Daun (Cone kecil)
            const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 4), getMat(0x4CAF50));
            leaf.position.set(0, 0.8, 0); leaf.rotation.x = 0.5;
            group.add(body, leaf);
            return group;
        }

        function createCorn3D() {
            const group = new THREE.Group();
            // Badan Jagung (Silinder segi 6)
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.6, 6), getMat(0xFFEB3B));
            body.castShadow = true;
            // Kulit Jagung Kiri Kanan
            const huskGeo = new THREE.ConeGeometry(0.3, 1.2, 3);
            const huskMat = getMat(0x689F38);
            const husk1 = new THREE.Mesh(huskGeo, huskMat); husk1.position.set(0.4, -0.2, 0); husk1.rotation.z = -0.3;
            const husk2 = new THREE.Mesh(huskGeo, huskMat); husk2.position.set(-0.4, -0.2, 0); husk2.rotation.z = 0.3;
            group.add(body, husk1, husk2);
            return group;
        }

        function createCarrot3D() {
            const group = new THREE.Group();
            // Wortel (Kerucut terbalik)
            const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.8, 5), getMat(0xFF5722));
            body.rotation.x = Math.PI; // Balik
            body.castShadow = true;
            // Daun Atas
            const leaf = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 4), getMat(0x4CAF50));
            leaf.position.set(0, 1.1, 0);
            group.add(body, leaf);
            return group;
        }

        // --- GAME LOGIC & PHYSICS ---
        let state = 'START', lastTime = 0, score = 0, gameSpeed = 10, nextObstacleTime = 0, currentStage = 1, timeElapsed = 0;
        
        const GRAVITY = 50; 
        const JUMP_VELOCITY = 18; 
        const SCORE_PER_STAGE = 60;

        // Kelas Karakter 3D
        class Character3D {
            constructor(meshBuilder, zone, xPos) {
                this.mesh = meshBuilder();
                this.zone = zone; 
                this.baseX = xPos;
                
                this.mesh.position.set(this.baseX, 1, 1); // Posisi Z=1 (Di tengah track)
                scene.add(this.mesh);

                this.y = 1; // 1 adalah tinggi di atas tanah
                this.vy = 0; 
                this.isJumping = false;
                this.hitRadius = 0.8; 
            }
            jump() { 
                if (!this.isJumping) { 
                    this.vy = JUMP_VELOCITY; this.isJumping = true; 
                    playSFX('jump'); 
                    spawnParticles3D(this.mesh.position.x, 0, this.mesh.position.z, 0xffffff); 
                } 
            }
            update(dt) {
                if (this.isJumping) {
                    this.vy -= GRAVITY * dt; 
                    this.y += this.vy * dt;
                    
                    // Squash & Stretch di 3D
                    this.mesh.scale.set(0.8, 1.2, 0.8);
                    this.mesh.rotation.x -= 5 * dt; // Putaran akrobatik

                    if (this.y <= 1) { // Mendarat (Karena titik tengah mesh di Y=1)
                        this.y = 1; this.vy = 0; this.isJumping = false; 
                        this.mesh.rotation.x = 0;
                        spawnParticles3D(this.mesh.position.x, 0, this.mesh.position.z, 0xffffff); 
                    }
                } else {
                    this.y = 1;
                    // Idle Animation (Napas/Ngambang pelan)
                    this.mesh.scale.set(1, 1 + Math.sin(timeElapsed * 5 + this.zone) * 0.05, 1);
                }
                this.mesh.position.y = this.y;
            }
        }

        class Obstacle3D {
            constructor() {
                // Batu Low Poly (Dodecahedron)
                this.mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8, 0), getMat(0x607D8B));
                this.mesh.castShadow = true;
                
                this.x = 15; // Muncul jauh di kanan
                this.mesh.position.set(this.x, 0.8, 1);
                scene.add(this.mesh);
                
                this.hitRadius = 0.7; 
                this.passedBy = []; 
            }
            update(dt) { 
                this.x -= gameSpeed * dt; 
                this.mesh.position.x = this.x;
                this.mesh.rotation.z += (gameSpeed * dt) / 0.8; // Menggelinding ke kiri
            }
            dispose() {
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        }

        // Particle System 3D
        let particles3D = [];
        const partGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        function spawnParticles3D(x, y, z, color) {
            const mat = new THREE.MeshBasicMaterial({ color: color });
            for(let i=0; i<6; i++) {
                const p = new THREE.Mesh(partGeo, mat);
                p.position.set(x + (Math.random()-0.5), y + Math.random(), z + (Math.random()-0.5));
                p.userData = {
                    vx: (Math.random() - 0.5) * 5 - (gameSpeed * 0.2), // Tertiup ke kiri
                    vy: Math.random() * 8,
                    vz: (Math.random() - 0.5) * 5,
                    life: 1.0
                };
                scene.add(p);
                particles3D.push(p);
            }
        }

        function createFloatingTextHTML(text, htmlX, htmlY) {
            const container = document.getElementById('floating-text-container');
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = htmlX + 'px';
            el.style.top = htmlY + 'px';
            container.appendChild(el);
            
            // Animasi CSS murni untuk pop-up
            setTimeout(() => {
                el.style.transform = 'translateY(-50px) scale(1.5)';
                el.style.opacity = '0';
            }, 10);
            
            setTimeout(() => { el.remove(); }, 800);
        }

        let characters = [], obstacles = [];
        
        window.addEventListener('resize', () => {
            cw = container.clientWidth; ch = container.clientHeight;
            renderer.setSize(cw, ch);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        });

        // --- MAIN LOOP ---
        function init() {
            // Bersihkan scene lama jika ada
            obstacles.forEach(o => o.dispose()); obstacles = [];
            particles3D.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); }); particles3D = [];
            characters.forEach(c => { scene.remove(c.mesh); }); characters = [];
            
            // Susunan karakter di kiri (Jarak persis seperti di gambar 2D)
            characters = [
                new Character3D(createOrange3D, 0, -5),  // Kiri
                new Character3D(createCorn3D, 1, -2),    // Tengah Kiri
                new Character3D(createCarrot3D, 2, 1)    // Tengah Kanan
            ];
            
            score = 0; currentStage = 1; 
            gameSpeed = 12; // Kecepatan awal
            document.getElementById('scoreDisplay').innerText = `🪙 0`; 
            document.getElementById('stageDisplay').innerText = `STAGE 1`;
            scene.background.setHex(0x87CEEB); scene.fog.color.setHex(0x87CEEB); // Reset warna siang
            nextObstacleTime = 1.5; // dalam detik
        }

        function startGame() {
            initAudio(); if (soundEnabled) bgm.play().catch(e => console.log("Audio prep"));
            document.getElementById('ui-start').classList.add('hidden'); document.getElementById('ui-gameover').classList.add('hidden');
            document.getElementById('ui-hud').style.display = 'flex'; init(); state = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'GAMEOVER'; playSFX('hit'); bgm.pause();
            
            // Efek hancur
            characters.forEach(c => spawnParticles3D(c.mesh.position.x, c.mesh.position.y, c.mesh.position.z, 0xff0000));
            
            document.getElementById('ui-hud').style.display = 'none'; document.getElementById('ui-gameover').classList.remove('hidden'); document.getElementById('finalScore').innerText = score;
        }

        function gameLoop(timestamp) {
            if (state !== 'PLAY') return; 
            let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp; timeElapsed += dt;
            update(dt); 
            renderer.render(scene, camera); 
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameSpeed += dt * 0.2; // Tambah cepat
            
            // Animasi Lingkungan (Pola garis track jalan)
            track.material.map && (track.material.map.offset.y -= gameSpeed * dt * 0.1);
            mountains.position.x -= (gameSpeed * 0.1) * dt;
            if(mountains.position.x < -10) mountains.position.x = 0;

            // Stage Check
            let targetStage = Math.floor(score / SCORE_PER_STAGE) + 1;
            if (targetStage > currentStage) {
                currentStage = targetStage; playSFX('stageUp'); gameSpeed += 1.5;
                document.getElementById('stageDisplay').innerText = `STAGE ${currentStage}`;
                
                // Ubah Warna Langit Berdasarkan Stage
                const colors = [0x87CEEB, 0xFFB74D, 0xBA68C8, 0x283593, 0xb71c1c];
                let cHex = colors[Math.min(currentStage - 1, colors.length - 1)];
                scene.background.setHex(cHex); scene.fog.color.setHex(cHex);
            }

            // Updates Characters
            characters.forEach(char => char.update(dt));
            
            // Update 3D Particles
            for (let i = particles3D.length - 1; i >= 0; i--) { 
                let p = particles3D[i];
                p.position.x += p.userData.vx * dt;
                p.position.y += p.userData.vy * dt;
                p.position.z += p.userData.vz * dt;
                p.userData.vy -= GRAVITY * 0.5 * dt; // Gravitasi partikel
                p.userData.life -= dt * 2;
                p.scale.setScalar(Math.max(0, p.userData.life)); // Makin kecil
                if (p.userData.life <= 0) {
                    scene.remove(p); p.material.dispose(); particles3D.splice(i, 1);
                }
            }

            // Spawner
            nextObstacleTime -= dt;
            if (nextObstacleTime <= 0) {
                obstacles.push(new Obstacle3D());
                let baseWait = Math.max(0.8, 1.5 - (currentStage * 0.1)); 
                nextObstacleTime = (Math.random() * 0.5) + baseWait; 
            }

            // Hit Detection & Scoring
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.update(dt);
                
                characters.forEach((char, index) => {
                    // Jarak 3D
                    let dist = char.mesh.position.distanceTo(obs.mesh.position);
                    
                    if (dist < char.hitRadius + obs.hitRadius) gameOver();
                    
                    if (obs.x < char.baseX && !obs.passedBy.includes(index)) {
                        obs.passedBy.push(index); score += 5; document.getElementById('scoreDisplay').innerText = `🪙 ${score}`;
                        if (obs.passedBy.length === 1) {
                            playSFX('score');
                            // Proyeksi koordinat 3D ke 2D Layar HTML untuk Floating Text
                            let pos = char.mesh.position.clone(); pos.y += 2;
                            pos.project(camera);
                            let xScreen = (pos.x * .5 + .5) * cw;
                            let yScreen = (pos.y * -.5 + .5) * ch;
                            createFloatingTextHTML("+15", xScreen, yScreen);
                        }
                    }
                });
                
                if (obs.x < -15) { obs.dispose(); obstacles.splice(i, 1); }
            }
        }

        // --- CONTROLS ---
        const btns = [{ el: document.getElementById('btn-orange'), id: 0 }, { el: document.getElementById('btn-corn'), id: 1 }, { el: document.getElementById('btn-carrot'), id: 2 }];
        btns.forEach(btn => {
            btn.el.addEventListener('touchstart', (e) => { e.preventDefault(); btn.el.classList.add('active-touch'); if (state === 'PLAY') characters[btn.id].jump(); }, {passive: false});
            btn.el.addEventListener('touchend', (e) => { e.preventDefault(); btn.el.classList.remove('active-touch'); });
            btn.el.addEventListener('mousedown', (e) => { if (state === 'PLAY') characters[btn.id].jump(); });
        });
        
        // Render pertama kali
        renderer.render(scene, camera); 
    </script>
</body>
</html>
