<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gao Ran Racing - Balanced Size</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212; font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-wrapper {
            position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 800px;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;
        }

        #canvas-container { flex-grow: 1; position: relative; width: 100%; background: #87CEEB; }
        canvas { display: block; width: 100%; height: 100%; }

        #controls-container {
            height: 110px; background: #2E7D32; border-top: 5px solid #1B5E20;
            display: flex; justify-content: space-between; padding: 12px; gap: 12px; z-index: 100;
        }
        
        .lane-btn {
            flex: 1; background: #4CAF50; border: 4px solid #81C784; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: 900; font-size: 18px; cursor: pointer;
            box-shadow: 0 6px 0 #1B5E20; transition: transform 0.05s, box-shadow 0.05s;
        }
        
        .lane-btn:active, .lane-btn.active-touch {
            transform: translateY(6px); box-shadow: 0 0 0 #1B5E20; background: #66BB6A;
        }

        .btn-emoji { font-size: 36px; line-height: 1; margin-bottom: 5px; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .hud { display: flex; justify-content: space-between; padding: 15px; pointer-events: auto; }

        .hud-box {
            background: rgba(0, 0, 0, 0.5); color: #FFEB3B;
            padding: 8px 20px; border-radius: 20px; font-size: 22px; font-weight: 900;
            border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }
        .hud-stage { color: #fff; background: rgba(33, 150, 243, 0.6); }

        .btn-sound {
            background: rgba(0,0,0,0.5); color: white; border: 2px solid rgba(255,255,255,0.2);
            width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer;
        }

        .screen-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.6); pointer-events: auto; transition: opacity 0.3s; z-index: 50; backdrop-filter: blur(3px);
        }

        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        .title { color: white; font-size: 46px; text-shadow: 4px 4px 0 #2E7D32; text-align: center; font-weight: 900; line-height: 1.1; }
        .subtitle { color: #fff; background: #FF9800; padding: 5px 15px; border-radius: 20px; font-size: 16px; margin: 20px 0 30px 0; font-weight: 700; text-align: center; border: 2px solid #fff;}
        
        .btn-play {
            background: linear-gradient(180deg, #FFCA28, #FF9800); color: #3e2723; border: 3px solid #fff; padding: 15px 60px; font-size: 30px;
            border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900;
            box-shadow: 0 8px 0 #E65100; cursor: pointer; text-transform: uppercase;
        }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0 0 #E65100; }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="ui-layer" id="ui-hud" style="display: none;">
                <div class="hud">
                    <div style="display: flex; gap: 10px;">
                        <div class="hud-box" id="scoreDisplay">🪙 0</div>
                        <div class="hud-box hud-stage" id="stageDisplay">STAGE 1</div>
                    </div>
                    <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
                </div>
            </div>

            <div class="screen-center" id="ui-start">
                <div class="title">GAO RAN<br>BERASTAGI</div>
                <div class="subtitle">Tap tombol di bawah untuk melompat!</div>
                <button class="btn-play" onclick="startGame()">MAIN</button>
            </div>

            <div class="screen-center hidden" id="ui-gameover">
                <div class="title" style="color: #FF5252; text-shadow: 4px 4px 0 #b71c1c;">YAH, NABRAK!</div>
                <div class="subtitle" style="font-size: 24px;">Skor Kamu: <span id="finalScore">0</span></div>
                <button class="btn-play" onclick="startGame()">COBA LAGI</button>
            </div>
        </div>

        <div id="controls-container">
            <div class="lane-btn" id="btn-orange"><div class="btn-emoji">🍊</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-corn"><div class="btn-emoji">🌽</div><div>TAP</div></div>
            <div class="lane-btn" id="btn-carrot"><div class="btn-emoji">🥕</div><div>TAP</div></div>
        </div>
    </div>

    <script>
        let audioCtx, soundEnabled = true;
        const bgm = document.getElementById('bgm'); bgm.volume = 0.3;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇'; if (soundEnabled && state === 'PLAY') bgm.play(); else bgm.pause(); }
        
        function playSFX(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'score') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1400, now + 0.05);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'stageUp') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
            }
        }

        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'), canvasContainer = document.getElementById('canvas-container');
        let state = 'START', lastTime = 0, score = 0, gameSpeed = 0, nextObstacleTime = 0, currentStage = 1, stageAnnounceTimer = 0, cw, ch;

        // Fisika Vertikal Lurus & Pasti
        const GRAVITY = 2500; 
        const JUMP_VELOCITY = -850; 
        const GROUND_Y_RATIO = 0.82; 
        const SCORE_PER_STAGE = 60;

        const stageColors = [
            { top: '#87CEEB', bot: '#E0F7FA' }, { top: '#FF9800', bot: '#FFE082' },
            { top: '#9C27B0', bot: '#F8BBD0' }, { top: '#1A237E', bot: '#5C6BC0' }, { top: '#b71c1c', bot: '#ef5350' }
        ];

        let characters = [], obstacles = [], clouds = [], trackOffset = 0, bgOffset = 0;
        function resize() { cw = canvasContainer.clientWidth; ch = canvasContainer.clientHeight; canvas.width = cw; canvas.height = ch; }
        window.addEventListener('resize', resize); resize();

        class Cloud {
            constructor() { this.x = cw + Math.random() * 200; this.y = ch * (0.05 + Math.random() * 0.2); this.speed = (cw * 0.05) + Math.random() * (cw * 0.05); this.scale = 0.5 + Math.random() * 0.8; }
            update(dt) { this.x -= this.speed * dt; }
            draw(ctx) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.beginPath();
                ctx.arc(this.x, this.y, 30 * this.scale, Math.PI * 0.5, Math.PI * 1.5);
                ctx.arc(this.x + 25 * this.scale, this.y - 15 * this.scale, 35 * this.scale, Math.PI * 1, Math.PI * 2);
                ctx.arc(this.x + 55 * this.scale, this.y, 25 * this.scale, Math.PI * 1.5, Math.PI * 0.5);
                ctx.closePath(); ctx.fill();
            }
        }

        function drawMountains() {
            let mX = -(bgOffset * 0.2) % cw; ctx.fillStyle = '#90A4AE'; 
            for (let i = 0; i < 2; i++) {
                let startX = mX + (i * cw);
                ctx.beginPath(); ctx.moveTo(startX - 100, ch * GROUND_Y_RATIO); ctx.lineTo(startX + cw*0.3, ch * 0.3); ctx.lineTo(startX + cw*0.7, ch * GROUND_Y_RATIO); ctx.fill();
                ctx.fillStyle = '#CFD8DC'; ctx.beginPath(); ctx.moveTo(startX + cw*0.3, ch * 0.3); ctx.lineTo(startX + cw*0.2, ch * 0.45); ctx.lineTo(startX + cw*0.3, ch * 0.4); ctx.lineTo(startX + cw*0.4, ch * 0.45); ctx.fill();
                ctx.fillStyle = '#78909C'; ctx.beginPath(); ctx.moveTo(startX + cw*0.4, ch * GROUND_Y_RATIO); ctx.lineTo(startX + cw*0.7, ch * 0.4); ctx.lineTo(startX + cw*1.1, ch * GROUND_Y_RATIO); ctx.fill();
            }
        }

        function drawFields() {
            let fX = -(bgOffset * 0.5) % cw; 
            for (let i = 0; i < 2; i++) {
                let startX = fX + (i * cw);
                ctx.fillStyle = '#689F38'; ctx.beginPath(); ctx.moveTo(startX, ch * GROUND_Y_RATIO); ctx.quadraticCurveTo(startX + cw*0.5, ch * 0.55, startX + cw, ch * GROUND_Y_RATIO); ctx.fill();
                ctx.fillStyle = '#8BC34A'; ctx.beginPath(); ctx.moveTo(startX - cw*0.2, ch * GROUND_Y_RATIO); ctx.quadraticCurveTo(startX + cw*0.3, ch * 0.65, startX + cw*0.8, ch * GROUND_Y_RATIO); ctx.fill();
            }
        }

        class Character {
            constructor(emoji, zone) {
                this.emoji = emoji; this.zone = zone; 
                this.size = ch * 0.11; // UKURAN DIPERKECIL
                this.baseX = cw * (0.2 + (this.zone * 0.3));
                this.x = this.baseX; this.y = ch * GROUND_Y_RATIO;
                this.vy = 0; this.isJumping = false;
                this.hitRadius = this.size * 0.25; // Hitbox mungil
            }
            jump() { if (!this.isJumping) { this.vy = JUMP_VELOCITY; this.isJumping = true; playSFX('jump'); } }
            update(dt) {
                this.size = ch * 0.11; this.hitRadius = this.size * 0.25;
                this.baseX = cw * (0.2 + (this.zone * 0.3));
                this.x = this.baseX; // TIDAK ADA LAGI EFEK MAJU KE DEPAN
                
                let ground = ch * GROUND_Y_RATIO;
                if (this.isJumping) {
                    this.vy += GRAVITY * dt; this.y += this.vy * dt;
                    if (this.y >= ground) { this.y = ground; this.vy = 0; this.isJumping = false; }
                } else {
                    this.y = ground;
                }
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y - this.size/2);
                ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                if (this.isJumping) ctx.rotate(0.15); 
                ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 10; ctx.fillText(this.emoji, 0, 0); ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.size = ch * 0.09; // BATU JUGA DIPERKECIL
                this.x = cw + this.size; this.y = ch * GROUND_Y_RATIO; 
                this.hitRadius = this.size * 0.30;
                this.passedBy = []; 
            }
            update(dt) { this.x -= gameSpeed * dt; }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y - this.size/2);
                ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 5; ctx.fillText('🪨', 0, 0); ctx.restore();
            }
        }

        function init() {
            characters = [new Character('🍊', 0), new Character('🌽', 1), new Character('🥕', 2)];
            obstacles = []; clouds = [new Cloud(), new Cloud()];
            score = 0; currentStage = 1; stageAnnounceTimer = 0;
            gameSpeed = cw * 0.6; document.getElementById('scoreDisplay').innerText = `🪙 0`; document.getElementById('stageDisplay').innerText = `STAGE 1`;
            nextObstacleTime = 1500;
        }

        function startGame() {
            initAudio(); if (soundEnabled) bgm.play().catch(e => console.log("Audio prep"));
            document.getElementById('ui-start').classList.add('hidden'); document.getElementById('ui-gameover').classList.add('hidden');
            document.getElementById('ui-hud').style.display = 'flex'; init(); state = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'GAMEOVER'; playSFX('hit'); bgm.pause();
            document.getElementById('ui-hud').style.display = 'none'; document.getElementById('ui-gameover').classList.remove('hidden'); document.getElementById('finalScore').innerText = score;
        }

        function gameLoop(timestamp) {
            if (state !== 'PLAY') return; let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp;
            update(dt); draw(); requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameSpeed += dt * 2.0; bgOffset = (bgOffset + gameSpeed * dt); trackOffset = (trackOffset + gameSpeed * dt) % 160; 
            if (stageAnnounceTimer > 0) stageAnnounceTimer -= dt;

            let targetStage = Math.floor(score / SCORE_PER_STAGE) + 1;
            if (targetStage > currentStage) {
                currentStage = targetStage; stageAnnounceTimer = 2.0; playSFX('stageUp'); gameSpeed += cw * 0.05;
                document.getElementById('stageDisplay').innerText = `STAGE ${currentStage}`;
            }

            clouds.forEach(c => c.update(dt)); if (Math.random() < 0.005 && clouds.length < 4) clouds.push(new Cloud()); clouds = clouds.filter(c => c.x > -100);
            characters.forEach(char => char.update(dt));

            nextObstacleTime -= dt * 1000;
            if (nextObstacleTime <= 0) {
                obstacles.push(new Obstacle());
                let baseWait = Math.max(1000, 1600 - (currentStage * 100)); nextObstacleTime = Math.random() * 800 + baseWait; 
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.update(dt);
                characters.forEach((char, index) => {
                    let dx = char.x - obs.x, dy = (char.y - char.size/2) - (obs.y - obs.size/2);
                    if (Math.sqrt(dx*dx + dy*dy) < char.hitRadius + obs.hitRadius) gameOver();
                    if (obs.x < char.x && !obs.passedBy.includes(index)) {
                        obs.passedBy.push(index); score += 5; document.getElementById('scoreDisplay').innerText = `🪙 ${score}`;
                        if (obs.passedBy.length === 1) playSFX('score');
                    }
                });
                if (obs.x < -100) obstacles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);
            let colorIndex = Math.min(currentStage - 1, stageColors.length - 1), activeColor = stageColors[colorIndex];
            let skyGrad = ctx.createLinearGradient(0, 0, 0, ch); skyGrad.addColorStop(0, activeColor.top); skyGrad.addColorStop(1, activeColor.bot);
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, cw, ch);
            
            clouds.forEach(c => c.draw(ctx)); drawMountains(); drawFields();
            
            let groundY = ch * GROUND_Y_RATIO;
            ctx.fillStyle = '#388E3C'; ctx.fillRect(0, groundY - 15, cw, 15); 
            for (let x = -trackOffset; x < cw; x += 160) { ctx.fillStyle = '#FFCA28'; ctx.fillRect(x, groundY, 80, ch - groundY); ctx.fillStyle = '#FF7043'; ctx.fillRect(x + 80, groundY, 80, ch - groundY); }
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, groundY, cw, 10); 

            obstacles.forEach(obs => obs.draw(ctx)); characters.forEach(char => char.draw(ctx));

            if (stageAnnounceTimer > 0) {
                ctx.save(); let alpha = Math.min(1, stageAnnounceTimer); ctx.fillStyle = `rgba(255, 235, 59, ${alpha})`; ctx.font = `900 ${ch * 0.12}px Nunito`; 
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`; ctx.lineWidth = 6;
                ctx.strokeText(`STAGE ${currentStage}!`, cw / 2, ch / 3); ctx.fillText(`STAGE ${currentStage}!`, cw / 2, ch / 3); ctx.restore();
            }
        }

        const btns = [{ el: document.getElementById('btn-orange'), id: 0 }, { el: document.getElementById('btn-corn'), id: 1 }, { el: document.getElementById('btn-carrot'), id: 2 }];
        btns.forEach(btn => {
            btn.el.addEventListener('touchstart', (e) => { e.preventDefault(); btn.el.classList.add('active-touch'); if (state === 'PLAY') characters[btn.id].jump(); }, {passive: false});
            btn.el.addEventListener('touchend', (e) => { e.preventDefault(); btn.el.classList.remove('active-touch'); });
            btn.el.addEventListener('mousedown', (e) => { if (state === 'PLAY') characters[btn.id].jump(); });
        });
        draw(); 
    </script>
</body>
</html>
